name: Build CHEN Termux APT Repository

concurrency:
  group: apt-repo-publish
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rani
      - god
      - chen-wrapper.sh
      - packaging/control
      - .github/workflows/apt-repo.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build .deb and signed APT metadata
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY"

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          unset APT_GPG_PRIVATE_KEY

          BIN=pkg/data/data/com.termux/files/usr/bin
          mkdir -p pkg/DEBIAN "$BIN"
          cp packaging/control pkg/DEBIAN/control

          # Install only rani + god
          install -m 0755 rani "$BIN/rani"
          install -m 0755 god  "$BIN/god"

          # chen wrapper runs rani -> god
          install -m 0755 chen-wrapper.sh "$BIN/chen"

          dpkg-deb --build --root-owner-group pkg chen_2.0.0_aarch64.deb

          mkdir -p public/pool/main/c/chen public/dists/stable/main/binary-aarch64
          cp chen_2.0.0_aarch64.deb public/pool/main/c/chen/
          cd public
          dpkg-scanpackages --arch aarch64 pool /dev/null > dists/stable/main/binary-aarch64/Packages
          gzip -kf dists/stable/main/binary-aarch64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=CHEN-LITE \
            -o APT::FTPArchive::Release::Label=CHENVIP \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=aarch64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --export > chenvip-archive-keyring.gpg

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
